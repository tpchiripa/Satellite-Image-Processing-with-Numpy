# GeoWatch local development stack.
#
# The `db` service (PostgreSQL + PostGIS) is used from Milestone 3 onward
# by PostgresEventStore (src/monitoring/postgres_store.py). To run the
# PostGIS-backed integration tests locally:
#     docker compose up -d db
#     TEST_DATABASE_URL=postgresql://geowatch:geowatch@localhost:5432/geowatch \
#         pytest tests/test_postgres_store.py -v
# The `app` service builds and runs tests; it will run the Streamlit
# dashboard starting Milestone 4.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geowatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geowatch
      POSTGRES_PASSWORD: geowatch
      POSTGRES_DB: geowatch
    ports:
      - "5432:5432"
    volumes:
      - geowatch_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: geowatch_app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://geowatch:geowatch@db:5432/geowatch
    volumes:
      - .:/app
    # Milestone 4+: ports: ["8501:8501"] once the Streamlit dashboard exists.

volumes:
  geowatch_pgdata:
